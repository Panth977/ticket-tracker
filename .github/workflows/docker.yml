name: Docker image

# The VM image (Dockerfile), published to GitHub Container Registry:
#   ghcr.io/panth977/ticket-tracker:latest       every push to main
#   ghcr.io/panth977/ticket-tracker:sha-<short>  every push to main
#   ghcr.io/panth977/ticket-tracker:<version>    every v* tag
# Pull requests build it (both platforms) without pushing.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/panth977/ticket-tracker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The image must start and serve the app, its config and the API on one port.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tm:smoke
          cache-from: type=gha
      - name: Run and probe
        run: |
          docker run -d --name tm -p 8080:8080 -e APP_URL=http://127.0.0.1:8080 tm:smoke
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/config.json && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<html'
          curl -fsS http://127.0.0.1:8080/config.json | grep -q '"platform":"icebase"'
          curl -fsS http://127.0.0.1:8080/__/icebase/health
          curl -fsS http://127.0.0.1:8080/.well-known/oauth-authorization-server | head -c 200
          docker logs tm | tail -20
