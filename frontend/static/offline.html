<!doctype html>
<!--
  The only page that exists when nothing has been cached yet (docs/plan/agents.html § S).
  Self-contained on purpose: no build assets, no fonts, no JS bundle — those are
  exactly what is missing when this page is reached.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)" />
    <title>Offline · TaskManager</title>
    <style>
      :root {
        --bg: #f7f6f3;
        --surface: #ffffff;
        --line: #e3e0da;
        --text: #1f1d1a;
        --muted: #6b6560;
        --accent: #3f5fe0;
        --accent-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151413;
          --surface: #1c1b19;
          --line: #2f2c29;
          --text: #ece9e4;
          --muted: #a39d96;
          --accent: #7089f5;
          --accent-fg: #0f1220;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 2rem 1.5rem;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1rem 0 0.35rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.925rem;
      }
      button {
        margin-top: 1.25rem;
        font: inherit;
        font-weight: 500;
        color: var(--accent-fg);
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        padding: 0.55rem 1.1rem;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="56" height="56" />
      <h1>You’re offline</h1>
      <p>
        TaskManager hasn’t finished downloading on this device yet, so there is nothing to show.
        Reconnect once and it will work offline from then on.
      </p>
      <button type="button" onclick="location.replace('/')">Try again</button>
    </main>
  </body>
</html>
