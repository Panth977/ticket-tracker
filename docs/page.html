<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/docs.css">
<title>TaskManager — the specification</title>
</head>
<body>
<!--
  ONE FILE FOR EVERY PAGE, because the address is the whole instruction.

  There were six of these, each passing its own kind, title and standfirst into
  the same renderer — six files that had to be kept in step with a list in
  `model.js`, and eight once the business side arrived. The environment and the
  kind are in the path; `/business/db` says everything this needs to know.
-->
<script type="module">
  import { index } from '/render.js';
  import { ENVIRONMENTS, KINDS } from '/model.js';

  const [, env, page] = location.pathname.split('/');
  const here = ENVIRONMENTS.find((e) => e.name === env) ?? ENVIRONMENTS[0];
  /* A bare environment opens on its first page, and anything unrecognised on
     the public side's — the address is corrected rather than refused. */
  const kind = here.kinds.find((k) => KINDS[k].slug === page) ?? here.kinds[0];

  const want = `/${here.name}/${KINDS[kind].slug}`;
  if (location.pathname !== want) history.replaceState(null, '', want);

  index(here.name, kind);
  await import('/docs.js');
</script>
</body>
</html>
