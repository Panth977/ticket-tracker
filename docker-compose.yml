# TaskManager on one VM:  cp .env.vm.example .env.vm  (set APP_URL), then
#   docker compose up -d
# The app, its API, MCP and live socket are all on port 8080; put your TLS
# proxy (Caddy, nginx, a load balancer) in front of it. State lives in the
# tm-data volume — back that up.
services:
  taskmanager:
    image: ghcr.io/panth977/ticket-tracker:latest
    # build: .        # or build it from this checkout
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file: .env.vm
    volumes:
      - tm-data:/data

volumes:
  tm-data:
